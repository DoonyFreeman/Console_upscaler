[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upscaler"
version = "1.0.0"
description = "CLI photo upscaler powered by Real-ESRGAN"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "click>=8.0",
    "rich>=13.0",
    "realesrgan>=0.3.0",
    "gfpgan>=1.3.0",
    "basicsr>=1.4.2",
    "customtkinter>=5.2",
    "tkinterdnd2>=0.4",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
build = ["pyinstaller>=6.0"]

[project.scripts]
upscale = "upscaler.cli:main"

[project.gui-scripts]
upscaler-gui = "upscaler.app:main"

[tool.setuptools.packages.find]
include = ["upscaler*"]
